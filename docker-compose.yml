services:
  init:
    image: alpine:3.20
    container_name: stretor_init
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: sh /workspace/scripts/bootstrap.sh
    networks:
      - stretor

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: stretor_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    # DNS confiável: o resolver padrão do host (herdado da operadora) costuma
    # bloquear ou devolver NXDOMAIN para domínios de tracker, o que faz o
    # indexador parecer "morto". Cloudflare e Google resolvem sem filtro.
    dns:
      - ${DNS_PRIMARIO:-1.1.1.1}
      - ${DNS_SECUNDARIO:-8.8.8.8}
    volumes:
      - ./backend:/var/www/backend
      - ./docker/backend/php.ini:/usr/local/etc/php/conf.d/custom.ini
      # O backend lê o config.xml do Prowlarr daqui para descobrir a chave da
      # API e provisionar os indexadores sozinho na subida (somente leitura).
      - prowlarr_config:/prowlarr-config:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB:-stretor}
      - DB_USERNAME=${POSTGRES_USER:-stretor}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - MEDIA_SERVICE_URL=http://media-service:3000
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE:-pt-BR}
      - TMDB_REGION=${TMDB_REGION:-BR}
      - TMDB_MAX_PAGES=${TMDB_MAX_PAGES:-25}
      - TORRENTS_TORZNAB_URL=${TORRENTS_TORZNAB_URL:-http://prowlarr:9696}
      # Normalmente vazio: o entrypoint grava aqui a chave descoberta no
      # Prowlarr. Só defina no .env para usar um Prowlarr externo.
      - TORRENTS_TORZNAB_KEY=${TORRENTS_TORZNAB_KEY:-}
      - TORRENTS_TORZNAB_CATEGORIA=${TORRENTS_TORZNAB_CATEGORIA:-2000}
      # Categoria Torznab de séries (5000 = TV). Sem ela, o Prowlarr filtraria
      # um episódio pela categoria de filme e devolveria zero resultados.
      - TORRENTS_TORZNAB_CATEGORIA_SERIE=${TORRENTS_TORZNAB_CATEGORIA_SERIE:-5000}
      # Orçamento da busca inteira, em segundos — os três degraus somados. Cada
      # degrau tinha o seu teto, mas os tetos não conversavam: um provedor
      # bloqueado custa a tentativa direta mais o socorro pelo FlareSolverr, e
      # isso se repete a cada termo do episódio. Como a cascata é sequencial, o
      # pior caso é a soma de tudo, e essa soma não tinha limite. Ao estourar,
      # a busca para onde está e devolve o que já recolheu.
      - TORRENTS_ORCAMENTO_BUSCA=${TORRENTS_ORCAMENTO_BUSCA:-45}
      # Orçamento do degrau do indexador, em segundos. É o teto que impede a
      # varredura sequencial dos indexadores de passar dos 60s de espera do
      # frontend — sem ele, a busca de episódio era cancelada pelo navegador.
      - TORRENTS_TORZNAB_ORCAMENTO=${TORRENTS_TORZNAB_ORCAMENTO:-8}
      # Fontes aproveitadas de um provedor a partir das quais ele para de ser
      # perguntado nos termos seguintes. Numa série nova os termos passam de vinte
      # e a soma das rodadas estoura a espera do frontend; o corte por provedor
      # derruba o número de requisições sem mexer na ordem final da lista.
      - TORRENTS_FONTES_SUFICIENTES_POR_PROVEDOR=${TORRENTS_FONTES_SUFICIENTES_POR_PROVEDOR:-4}
      # Usados pelo comando `prowlarr:provisionar` na subida do container.
      - PROWLARR_URL=${PROWLARR_URL:-http://prowlarr:9696}
      # Sem este caminho o provisionamento não acha o config.xml, não descobre a
      # chave da API e nunca chega a cadastrar o indexador.
      - PROWLARR_CONFIG_PATH=${PROWLARR_CONFIG_PATH:-/prowlarr-config/config.xml}
      - PROWLARR_TEMPO_LIMITE=${PROWLARR_TEMPO_LIMITE:-20}
      # Indexadores públicos que o provisionamento cadastra sozinho, por vírgula,
      # pelos identificadores das definições Cardigann.
      - PROWLARR_INDEXADORES=${PROWLARR_INDEXADORES:-1337x,thepiratebay,torrentgalaxy}
      # Subconjunto que exige o FlareSolverr por estar atrás do CloudFlare.
      - PROWLARR_PROXY_INDEXADORES=${PROWLARR_PROXY_INDEXADORES:-1337x,torrentgalaxy}
      # O 1337x e o TorrentGalaxy vivem atrás do CloudFlare e recusam o teste de
      # busca do Prowlarr, que por isso nunca os tira de inativo. O FlareSolverr
      # resolve o desafio e o backend o registra como proxy dos indexadores.
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://flaresolverr:8191}
      # false pula o registro do proxy: os indexadores protegidos voltam a ficar
      # apenas cadastrados, sem funcionar.
      - PROWLARR_PROXY_ATIVO=${PROWLARR_PROXY_ATIVO:-true}
      # Socorro pelo FlareSolverr também na busca nativa (degrau 1). Sem isto, os
      # provedores nativos falam HTTP direto e batem de frente no Cloudflare — foi
      # assim que o BT4G passou a responder 403 e os trackers PT-BR sumiram. Com
      # isto ligado, o ClienteHttp reenvia pelo FlareSolverr o que vier bloqueado.
      - TORRENTS_PROXY_NATIVO=${TORRENTS_PROXY_NATIVO:-true}
      - TORRENTS_PROXY_NATIVO_TIMEOUT=${TORRENTS_PROXY_NATIVO_TIMEOUT:-70}
      # Reserva de torrents (YTS) usada quando o indexador não responde.
      - TORRENTS_BASE_URL=${TORRENTS_BASE_URL:-https://yts.gg}
      - TORRENTS_CACHE_TTL=${TORRENTS_CACHE_TTL:-1800}
      # Ignora a leitura do cache das consultas externas durante a busca, forçando
      # uma nova ida à origem. Serve para tirar o resultado velho preso por horas
      # quando o provedor mudou de comportamento. Padrão false.
      - TORRENTS_CACHE_BYPASS=${TORRENTS_CACHE_BYPASS:-false}
      # Idiomas pedidos ao Torrentio. Sem isso ele responde só com o catálogo
      # padrão (quase todo em inglês) e as séries não trazem fonte dublada.
      - TORRENTS_TORRENTIO_IDIOMAS=${TORRENTS_TORRENTIO_IDIOMAS:-portuguese}
      # Segunda consulta ao Torrentio, sem o filtro de idioma, quando a busca é de
      # série: é por ela que os packs de temporada aparecem. O parser interno
      # classifica o idioma depois. Padrão true.
      - TORRENTS_TORRENTIO_BUSCA_AMPLA=${TORRENTS_TORRENTIO_BUSCA_AMPLA:-true}
      # Endereços e limites dos provedores nativos do degrau 1. Sem estas no
      # environment, o container cai nos padrões do config/services.php e o valor
      # do .env da raiz não chega a valer — o mesmo furo que deixou a Fase 1
      # inerte. Os trackers PT-BR nascem vazios de propósito (os domínios antigos
      # morreram); preencha no .env para reativar.
      - TORRENTS_TRACKERS_BR_URLS=${TORRENTS_TRACKERS_BR_URLS:-}
      - TORRENTS_TRACKERS_BR_BUSCA=${TORRENTS_TRACKERS_BR_BUSCA:-index.php}
      - TORRENTS_APIBAY_URL=${TORRENTS_APIBAY_URL:-https://apibay.org}
      - TORRENTS_TORRENTIO_URL=${TORRENTS_TORRENTIO_URL:-https://torrentio.strem.fun}
      - TORRENTS_BT4G_URLS=${TORRENTS_BT4G_URLS:-https://bt4gprx.com}
      - TORRENTS_MAX_DETALHES_BUSCA=${TORRENTS_MAX_DETALHES_BUSCA:-16}
      - TORRENTS_TEMPO_LIMITE=${TORRENTS_TEMPO_LIMITE:-15}
      - TORRENTS_ACERVO_MUNDIAL_TEMPO_LIMITE=${TORRENTS_ACERVO_MUNDIAL_TEMPO_LIMITE:-8}
      - TORRENTS_USER_AGENT=${TORRENTS_USER_AGENT:-Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36}
      # Corte de idioma e a exceção do pack de temporada. Sem estas três no
      # environment, o container cai no padrão do config/services.php e o valor
      # do .env da raiz não chega a valer — foi o que deixou a Fase 1 inerte.
      - TORRENTS_APENAS_PT_BR=${TORRENTS_APENAS_PT_BR:-true}
      # Corte duro de idioma: descarta original e legendado da lista final,
      # deixando só dublado e dual áudio. Sem esta linha no environment, o valor
      # do .env da raiz não chega ao container.
      - TORRENTS_SOMENTE_PT_BR_OU_LEGENDADO=${TORRENTS_SOMENTE_PT_BR_OU_LEGENDADO:-true}
      - TORRENTS_PACKS_HABILITADOS=${TORRENTS_PACKS_HABILITADOS:-true}
      - TORRENTS_PACKS_QUALQUER_IDIOMA=${TORRENTS_PACKS_QUALQUER_IDIOMA:-true}
      # Termos de série no fim da cascata: sem numeração e sem "completa", é o
      # que alcança o pack multi-temporada das séries antigas. As fontes vindas
      # deles passam pelo gate de temporada antes de entrar na lista.
      - TORRENTS_TERMOS_SERIE_HABILITADO=${TORRENTS_TERMOS_SERIE_HABILITADO:-true}
      # Fase 2B: o Knaben enxerga os packs que o Torrentio e os trackers nativos
      # não acham, e os addons Stremio hospedados entram por imdb_id, no mesmo
      # protocolo do Torrentio. Sem estas no environment, o container cai nos
      # padrões do config/services.php e o valor do .env da raiz não vale.
      - TORRENTS_KNABEN_HABILITADO=${TORRENTS_KNABEN_HABILITADO:-true}
      - TORRENTS_KNABEN_URL=${TORRENTS_KNABEN_URL:-https://api.knaben.org/v1}
      - TORRENTS_KNABEN_LIMITE=${TORRENTS_KNABEN_LIMITE:-20}
      - TORRENTS_STREMIO_ADDONS=${TORRENTS_STREMIO_ADDONS:-https://thepiratebay-plus.strem.fun}
      # Mínimo de fontes da lista final e meta de coleta PT-BR. Sem estas no
      # environment, o container cai nos padrões do config/services.php e o
      # valor do .env da raiz não chega a valer.
      - TORRENTS_MINIMO_FONTES=${TORRENTS_MINIMO_FONTES:-15}
      - TORRENTS_META_PT_BR=${TORRENTS_META_PT_BR:-6}
      # Inspeção de pack: quantos por busca, quanto esperar e por quanto tempo
      # guardar o veredito. É o que abre o pack quando o nome não prova idioma.
      - TORRENTS_INSPECAO_PACKS_LIMITE=${TORRENTS_INSPECAO_PACKS_LIMITE:-6}
      - TORRENTS_INSPECAO_TIMEOUT=${TORRENTS_INSPECAO_TIMEOUT:-12}
      - TORRENTS_INSPECAO_CACHE_TTL=${TORRENTS_INSPECAO_CACHE_TTL:-86400}
      # Cobertura completa: com a meta PT-BR batida, ainda desce os degraus
      # restantes (indexador e YTS) para que todo provedor seja consultado ao
      # menos uma vez — é o que o relatório de cobertura usa como prova.
      - TORRENTS_COBERTURA_COMPLETA=${TORRENTS_COBERTURA_COMPLETA:-false}
      # Buscar em todos os provedores: a meta PT-BR deixa de encerrar a busca e a
      # cascata percorre o registro inteiro, deixando cada provedor de lado só
      # depois que ele rendeu TORRENTS_FONTES_SUFICIENTES_POR_PROVEDOR fontes.
      - TORRENTS_BUSCAR_TODOS=${TORRENTS_BUSCAR_TODOS:-true}
      # Fallback de stream direto (MP4/HLS). O motor de busca é o SearXNG
      # interno do compose (`http://searxng:8080/search`), e não uma instância
      # pública nem um buscador comercial: o SearXNG sobe junto com o stack, tem
      # cota própria e devolve JSON limpo. O endereço é só o endpoint de busca —
      # a query e o `format=json` entram na hora da requisição.
      - TORRENTS_STREAM_DIRETO_HABILITADO=${TORRENTS_STREAM_DIRETO_HABILITADO:-false}
      - TORRENTS_STREAM_DIRETO_MOTORES=${TORRENTS_STREAM_DIRETO_MOTORES:-http://searxng:8080/search}
      - TORRENTS_STREAM_DIRETO_BRAVE_KEY=${TORRENTS_STREAM_DIRETO_BRAVE_KEY:-}
      - TORRENTS_STREAM_DIRETO_TERMOS=${TORRENTS_STREAM_DIRETO_TERMOS:-}
      - TORRENTS_STREAM_DIRETO_MAX_TERMOS=${TORRENTS_STREAM_DIRETO_MAX_TERMOS:-8}
      - TORRENTS_STREAM_DIRETO_INTERVALO_MIN=${TORRENTS_STREAM_DIRETO_INTERVALO_MIN:-800}
      - TORRENTS_STREAM_DIRETO_INTERVALO_MAX=${TORRENTS_STREAM_DIRETO_INTERVALO_MAX:-2200}
      - TORRENTS_STREAM_DIRETO_MAX_PAGINAS=${TORRENTS_STREAM_DIRETO_MAX_PAGINAS:-6}
      - TORRENTS_STREAM_DIRETO_TEMPO_LIMITE=${TORRENTS_STREAM_DIRETO_TEMPO_LIMITE:-10}
      - TORRENTS_STREAM_DIRETO_ORCAMENTO=${TORRENTS_STREAM_DIRETO_ORCAMENTO:-12}
      # Busca direta nos agregadores, antes do motor web. O atalho contorna a
      # suspensão dos buscadores comerciais que o SearXNG agrega: em vez de
      # perguntar ao motor onde o episódio mora, o provedor pergunta à busca
      # interna do próprio agregador (verpobreflix, tokyvideo).
      - TORRENTS_STREAM_DIRETO_BUSCA_DIRETA=${TORRENTS_STREAM_DIRETO_BUSCA_DIRETA:-true}
      # Travessia de players de embed: quando o agregador só embute um iframe de
      # terceiro (plenoflu.com), o provedor percorre a cadeia até o master.m3u8
      # assinado em vez de descartar a página.
      - TORRENTS_STREAM_DIRETO_RESOLVER_EMBEDS=${TORRENTS_STREAM_DIRETO_RESOLVER_EMBEDS:-true}
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prowlarr:
        condition: service_started
      # O provisionamento grava o proxy no Prowlarr, e essa gravação testa a
      # conexão. Esperar o FlareSolverr ficar saudável evita subir o backend
      # enquanto o Chromium ainda está abrindo — quando o teste falha e o
      # indexador protegido acaba ficando inativo.
      flaresolverr:
        condition: service_healthy
      # O fallback de stream direto consulta o SearXNG interno. Esperar o
      # healthcheck (que já testa a saída JSON) evita subir o backend apontando
      # para um motor que ainda não responde.
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - stretor

  nginx:
    image: nginx:1.27-alpine
    container_name: stretor_nginx
    restart: unless-stopped
    # O Codespaces encaminha a porta 80 do Space para uma URL HTTPS pública.
    # Manter o mapeamento em 80:80 faz o Nginx ser a porta principal do sistema
    # tanto no PC local quanto no Space, sem precisar de configuração extra.
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - stretor

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: stretor_frontend
    restart: unless-stopped
    working_dir: /app
    expose:
      - "5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost/api}
      - VITE_MEDIA_SERVICE_URL=${VITE_MEDIA_SERVICE_URL:-http://localhost/media}
      # Paciência do player com uma fonte. Numa conexão lenta o buffer inicial do
      # HLS demora mais que os 90 s padrão e uma fonte boa era abandonada no meio
      # do preparo. Estes valores precisam ser maiores que os do media-service
      # (MEDIA_TIMEOUT_*), para que o backend desista primeiro e o overlay receba
      # o motivo real em vez de um cancelamento do navegador.
      - VITE_TIMEOUT_FONTE_MS=${VITE_TIMEOUT_FONTE_MS:-90000}
      - VITE_ESTAGNACAO_FONTE_MS=${VITE_ESTAGNACAO_FONTE_MS:-20000}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5173', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - stretor

  media-service:
    build:
      context: .
      dockerfile: docker/media-service/Dockerfile
    container_name: stretor_media_service
    restart: unless-stopped
    working_dir: /app
    # DNS confiável, pelo mesmo motivo do backend e do Prowlarr: é este container
    # que abre o torrent, e o resolver herdado da operadora costuma bloquear ou
    # devolver NXDOMAIN para domínios de tracker. Sem resolver os anunciadores
    # nem alcançar os roteadores do DHT, o WebTorrent não forma malha e a fonte
    # aparece como "sem peers" mesmo estando viva.
    dns:
      - ${DNS_PRIMARIO:-1.1.1.1}
      - ${DNS_SECUNDARIO:-8.8.8.8}
    ports:
      - "${MEDIA_SERVICE_PORT:-3000}:3000"
      # Porta de escuta do WebTorrent (TCP) e a equivalente uTP (UDP). Sem
    #
    # O valor daqui também alimenta o `/etc/resolv.conf` que o entrypoint escreve
    # (ver docker/media-service/entrypoint.sh): o forwarder embutido do Docker é o
    # último da lista, e não o único servidor. Foi ele que falhou nas rajadas de
    # resolução que derrubavam a abertura da fonte direta.
      # publicá-las, o container só faz conexões de saída e não aceita nenhuma
      # de entrada — a malha fica pela metade e a chance de achar peer cai muito.
      # O valor precisa bater com `torrentPort` em `sessoes.js`.
      - "${MEDIA_TORRENT_PORT:-51413}:51413/tcp"
      - "${MEDIA_TORRENT_PORT:-51413}:51413/udp"
    volumes:
      - ./media-service:/app
      - /app/node_modules
      - media_storage:/app/storage
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - STORAGE_PATH=/app/storage
      # Porta de escuta do WebTorrent. Fixa para casar com o mapeamento acima:
      # uma porta aleatória a cada subida nunca seria alcançável de fora.
      - MEDIA_TORRENT_PORT=${MEDIA_TORRENT_PORT:-51413}
      # Paciência do media-service com fontes de poucos peers. O timeout de
      # dados mede a espera pelo primeiro byte, não a velocidade: uma fonte
      # lenta mas viva demora a conectar e depois baixa normalmente, e era
      # Servidores que o entrypoint grava no `/etc/resolv.conf` do container. O
      # forwarder do Docker entra como último da lista (reserva para os nomes
      # internos do compose), e não como único servidor.
      - DNS_PRIMARIO=${DNS_PRIMARIO:-1.1.1.1}
      - DNS_SECUNDARIO=${DNS_SECUNDARIO:-8.8.8.8}
      # justamente ela que o corte de 30 s matava. Estes valores ficam abaixo
      # do TIMEOUT_FONTE_MS do frontend (90 s) para o backend desistir primeiro.
      - MEDIA_TIMEOUT_DADOS_MS=${MEDIA_TIMEOUT_DADOS_MS:-30000}
      - MEDIA_TIMEOUT_METADADOS_MS=${MEDIA_TIMEOUT_METADADOS_MS:-20000}
      # Resiliência a fontes de poucos seeds. O prazo de espera por um trecho
      # deixou de ser um relógio fixo: ele só corre enquanto o download estiver
      # parado, e cada avanço real de bytes renova a espera. Uma fonte lenta mas
      # viva não é mais cortada no meio do caminho; só a que estagna de verdade.
      - MEDIA_ESTAGNACAO_PECAS_MS=${MEDIA_ESTAGNACAO_PECAS_MS:-90000}
      - MEDIA_TETO_PECAS_MS=${MEDIA_TETO_PECAS_MS:-900000}
      # Com poucos peers a janela de leitura é ampliada, dando ao picker mais
      # pedaços elegíveis para pedir a peers vizinhos.
      - MEDIA_PEERS_ESCASSOS=${MEDIA_PEERS_ESCASSOS:-3}
      - MEDIA_FATOR_JANELA_ESCASSOS=${MEDIA_FATOR_JANELA_ESCASSOS:-2}
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - stretor

  postgres:
    image: postgres:16-alpine
    container_name: stretor_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stretor}
      POSTGRES_USER: ${POSTGRES_USER:-stretor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stretor} -d ${POSTGRES_DB:-stretor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stretor

  redis:
    image: redis:7-alpine
    container_name: stretor_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stretor

  # Indexador que unifica os trackers (públicos e privados) e expõe a API Torznab.
  # É por aqui que o backend encontra os torrents dublados em PT-BR, já que os
  # sites generalistas não oferecem uma API limpa como o YTS.
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: stretor_prowlarr
    restart: unless-stopped
    # O Prowlarr é quem resolve os domínios dos trackers ao cadastrar e ao
    # consultar os indexadores. Sem DNS confiável, um tracker bloqueado pela
    # operadora aparece como "indexador fora do ar" no painel.
    dns:
      - ${DNS_PRIMARIO:-1.1.1.1}
      - ${DNS_SECUNDARIO:-8.8.8.8}
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - prowlarr_config:/config
      # Definições customizadas ficam versionadas no projeto e são montadas por
      # cima da pasta padrão, para sobreviverem a recriações do container.
      - ./docker/prowlarr/Definitions/Custom:/config/Definitions/Custom
    networks:
      - stretor

  # Alguns trackers públicos respondem ao Prowlarr com "blocked by CloudFlare
  # Protection": o teste de busca falha, o cadastro é recusado e o indexador fica
  # inativo para sempre. O FlareSolverr abre um navegador headless, resolve o
  # desafio e devolve os cookies — o Prowlarr então alcança o tracker como se
  # fosse um visitante comum. Ele não expõe porta no host: só o Prowlarr fala
  # com ele, pela rede interna.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: stretor_flaresolverr
    restart: unless-stopped
    # O Chromium daqui é quem resolve o domínio do tracker, então a consulta de
    # nomes precisa ser a mesma do Prowlarr. Sem este bloco, o FlareSolverr herda
    # o resolver do operador: dele vem ora NXDOMAIN, ora uma página de bloqueio —
    # e nenhuma das duas passa pelo CloudFlare, que é justamente o que o proxy
    # existe para resolver.
    dns:
      - ${DNS_PRIMARIO:-1.1.1.1}
      - ${DNS_SECUNDARIO:-8.8.8.8}
    # O Chromium embutido precisa de /dev/shm com folga. O padrão do Docker é de
    # 64 MB, e abaixo disso o navegador morre ao subir: o FlareSolverr então
    # responde 500 em toda requisição.
    shm_size: "1gb"
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - CAPTCHA_SOLVER=none
      # O Chromium resolve por DoH, fora do UDP/53 do provedor — é o que sobra
      # quando o DNS do operador intercepta as consultas.
      - DNS_OVER_HTTPS=${FLARESOLVERR_DNS_OVER_HTTPS:-true}
      - TZ=${TZ:-America/Sao_Paulo}
    expose:
      - "8191"
    healthcheck:
      # A imagem traz Python, então evitamos depender de curl/wget.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8191/health').status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - stretor

  # Motor de busca do fallback de stream direto. O DuckDuckGo passou a bloquear o
  # IP dos containers com status 202 (rate limit/anti-bot) e as instâncias
  # públicas de SearXNG vêm e vão — nenhuma das duas é base confiável. Aqui o
  # SearXNG roda dentro da rede do compose e é consultado só pelo backend, em
  # `http://searxng:8080/search`. Não expõe porta no host: não há instância
  # pública envolvida nem IP de container bloqueado por terceiros.
  searxng:
    image: searxng/searxng:latest
    container_name: stretor_searxng
    restart: unless-stopped
    # O SearXNG resolve os domínios dos motores (Google, Bing, DDG) por conta
    # própria. Sem DNS confiável, o resolver herdado da operadora devolve
    # NXDOMAIN ou página de bloqueio e a busca interna volta vazia.
    dns:
      - ${DNS_PRIMARIO:-1.1.1.1}
      - ${DNS_SECUNDARIO:-8.8.8.8}
    volumes:
      # O settings.yml versionado liga a saída JSON — sem ele, `format=json`
      # responde 403 e o motor pareceria morto. É a única razão do arquivo.
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-stretor_searxng_interno}
      - TZ=${TZ:-America/Sao_Paulo}
    # Só a rede interna: o backend fala com ele por `http://searxng:8080`.
    expose:
      - "8080"
    healthcheck:
      # A imagem traz Python; evitamos depender de curl/wget. A consulta de
      # busca com `format=json` é o teste real: se o JSON estiver desligado, o
      # healthcheck falha e o backend não sobe esperando um motor quebrado.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/search?q=teste&format=json').status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - stretor

networks:
  stretor:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_storage:
  prowlarr_config:
