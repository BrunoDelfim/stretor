services:
  init:
    image: alpine:3.20
    container_name: stretor_init
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: sh /workspace/scripts/bootstrap.sh
    networks:
      - stretor

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: stretor_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    # DNS confiável: o resolver padrão do host (herdado da operadora) costuma
    # bloquear ou devolver NXDOMAIN para domínios de tracker, o que faz o
    # indexador parecer "morto". Cloudflare e Google resolvem sem filtro.
    dns:
      - ${DNS_PRIMARIO:-1.1.1.1}
      - ${DNS_SECUNDARIO:-8.8.8.8}
    volumes:
      - ./backend:/var/www/backend
      - ./docker/backend/php.ini:/usr/local/etc/php/conf.d/custom.ini
      # O backend lê o config.xml do Prowlarr daqui para descobrir a chave da
      # API e provisionar os indexadores sozinho na subida (somente leitura).
      - prowlarr_config:/prowlarr-config:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${POSTGRES_DB:-stretor}
      - DB_USERNAME=${POSTGRES_USER:-stretor}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - MEDIA_SERVICE_URL=http://media-service:3000
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_LANGUAGE=${TMDB_LANGUAGE:-pt-BR}
      - TMDB_REGION=${TMDB_REGION:-BR}
      - TMDB_MAX_PAGES=${TMDB_MAX_PAGES:-25}
      - TORRENTS_TORZNAB_URL=${TORRENTS_TORZNAB_URL:-http://prowlarr:9696}
      # Normalmente vazio: o entrypoint grava aqui a chave descoberta no
      # Prowlarr. Só defina no .env para usar um Prowlarr externo.
      - TORRENTS_TORZNAB_KEY=${TORRENTS_TORZNAB_KEY:-}
      - TORRENTS_TORZNAB_CATEGORIA=${TORRENTS_TORZNAB_CATEGORIA:-2000}
      # Categoria Torznab de séries (5000 = TV). Sem ela, o Prowlarr filtraria
      # um episódio pela categoria de filme e devolveria zero resultados.
      - TORRENTS_TORZNAB_CATEGORIA_SERIE=${TORRENTS_TORZNAB_CATEGORIA_SERIE:-5000}
      # Usados pelo comando `prowlarr:provisionar` na subida do container.
      - PROWLARR_URL=${PROWLARR_URL:-http://prowlarr:9696}
      # Sem este caminho o provisionamento não acha o config.xml, não descobre a
      # chave da API e nunca chega a cadastrar o indexador.
      - PROWLARR_CONFIG_PATH=${PROWLARR_CONFIG_PATH:-/prowlarr-config/config.xml}
      - PROWLARR_TEMPO_LIMITE=${PROWLARR_TEMPO_LIMITE:-20}
      # O 1337x vive atrás do CloudFlare e recusa o teste de busca do Prowlarr,
      # que por isso nunca sai de inativo. O FlareSolverr resolve o desafio e o
      # backend o registra como proxy do indexador na subida.
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://flaresolverr:8191}
      # false pula o registro do proxy: o indexador protegido volta a ficar
      # apenas cadastrado, sem funcionar.
      - PROWLARR_PROXY_ATIVO=${PROWLARR_PROXY_ATIVO:-true}
      # Reserva de torrents (YTS) usada quando o indexador não responde.
      - TORRENTS_BASE_URL=${TORRENTS_BASE_URL:-https://yts.gg}
      - TORRENTS_CACHE_TTL=${TORRENTS_CACHE_TTL:-1800}
      # Idiomas pedidos ao Torrentio. Sem isso ele responde só com o catálogo
      # padrão (quase todo em inglês) e as séries não trazem fonte dublada.
      - TORRENTS_TORRENTIO_IDIOMAS=${TORRENTS_TORRENTIO_IDIOMAS:-portuguese}
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prowlarr:
        condition: service_started
      # O provisionamento grava o proxy no Prowlarr, e essa gravação testa a
      # conexão. Esperar o FlareSolverr ficar saudável evita subir o backend
      # enquanto o Chromium ainda está abrindo — quando o teste falha e o
      # indexador protegido acaba ficando inativo.
      flaresolverr:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - stretor

  nginx:
    image: nginx:1.27-alpine
    container_name: stretor_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - stretor

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: stretor_frontend
    restart: unless-stopped
    working_dir: /app
    expose:
      - "5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost/api}
      - VITE_MEDIA_SERVICE_URL=${VITE_MEDIA_SERVICE_URL:-http://localhost/media}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5173', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - stretor

  media-service:
    build:
      context: .
      dockerfile: docker/media-service/Dockerfile
    container_name: stretor_media_service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${MEDIA_SERVICE_PORT:-3000}:3000"
    volumes:
      - ./media-service:/app
      - /app/node_modules
      - media_storage:/app/storage
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - STORAGE_PATH=/app/storage
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - stretor

  postgres:
    image: postgres:16-alpine
    container_name: stretor_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stretor}
      POSTGRES_USER: ${POSTGRES_USER:-stretor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stretor} -d ${POSTGRES_DB:-stretor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stretor

  redis:
    image: redis:7-alpine
    container_name: stretor_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stretor

  # Indexador que unifica os trackers (públicos e privados) e expõe a API Torznab.
  # É por aqui que o backend encontra os torrents dublados em PT-BR, já que os
  # sites generalistas não oferecem uma API limpa como o YTS.
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: stretor_prowlarr
    restart: unless-stopped
    # O Prowlarr é quem resolve os domínios dos trackers ao cadastrar e ao
    # consultar os indexadores. Sem DNS confiável, um tracker bloqueado pela
    # operadora aparece como "indexador fora do ar" no painel.
    dns:
      - ${DNS_PRIMARIO:-1.1.1.1}
      - ${DNS_SECUNDARIO:-8.8.8.8}
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - prowlarr_config:/config
      # Definições customizadas ficam versionadas no projeto e são montadas por
      # cima da pasta padrão, para sobreviverem a recriações do container.
      - ./docker/prowlarr/Definitions/Custom:/config/Definitions/Custom
    networks:
      - stretor

  # Alguns trackers públicos respondem ao Prowlarr com "blocked by CloudFlare
  # Protection": o teste de busca falha, o cadastro é recusado e o indexador fica
  # inativo para sempre. O FlareSolverr abre um navegador headless, resolve o
  # desafio e devolve os cookies — o Prowlarr então alcança o tracker como se
  # fosse um visitante comum. Ele não expõe porta no host: só o Prowlarr fala
  # com ele, pela rede interna.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: stretor_flaresolverr
    restart: unless-stopped
    # O Chromium daqui é quem resolve o domínio do tracker, então a consulta de
    # nomes precisa ser a mesma do Prowlarr. Sem este bloco, o FlareSolverr herda
    # o resolver do operador: dele vem ora NXDOMAIN, ora uma página de bloqueio —
    # e nenhuma das duas passa pelo CloudFlare, que é justamente o que o proxy
    # existe para resolver.
    dns:
      - ${DNS_PRIMARIO:-1.1.1.1}
      - ${DNS_SECUNDARIO:-8.8.8.8}
    # O Chromium embutido precisa de /dev/shm com folga. O padrão do Docker é de
    # 64 MB, e abaixo disso o navegador morre ao subir: o FlareSolverr então
    # responde 500 em toda requisição.
    shm_size: "1gb"
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - CAPTCHA_SOLVER=none
      # O Chromium resolve por DoH, fora do UDP/53 do provedor — é o que sobra
      # quando o DNS do operador intercepta as consultas.
      - DNS_OVER_HTTPS=${FLARESOLVERR_DNS_OVER_HTTPS:-true}
      - TZ=${TZ:-America/Sao_Paulo}
    expose:
      - "8191"
    healthcheck:
      # A imagem traz Python, então evitamos depender de curl/wget.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8191/health').status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - stretor

networks:
  stretor:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_storage:
  prowlarr_config:
