# Configuração do SearXNG auto-hospedado do Stretor.
#
# O SearXNG é o motor de busca do fallback de stream direto. Ele roda dentro da
# rede do compose e é consultado só pelo backend, em `http://searxng:8080/search`
# — não expõe porta no host, então não há instância pública envolvida nem IP de
# container bloqueado por terceiros.
#
# O ponto que faz este arquivo existir: o SearXNG **desliga a saída JSON por
# padrão**. Sem `json` na lista de formatos abaixo, toda consulta com
# `format=json` responde 403 e o motor pareceria morto. É a única razão de
# versionarmos um settings.yml em vez de subir a imagem crua.

use_default_settings: true

server:
  # Chave usada para assinar as requisições internas. Não é segredo de verdade:
  # o serviço só é alcançável pela rede do compose. Trocar aqui não muda nada
  # para o backend, que fala HTTP direto com o endpoint de busca.
  secret_key: "stretor_searxng_interno"
  # O limiter bloqueia rajadas por IP — e o backend é um único IP (o do
  # container). Como a busca dispara vários termos em sequência, o limiter
  # derrubaria justamente o que queremos. Desligado porque o acesso já é
  # restrito à rede interna.
  limiter: false
  public_instance: false
  image_proxy: false

search:
  # O formato JSON é o que o MotorBuscaWeb consome. Sem ele, `format=json`
  # devolve 403 e o fallback fica sem motor.
  formats:
    - html
    - json
  # Idioma padrão das consultas. O backend manda o termo já em PT-BR; isto só
  # define o `language` quando a requisição não o informa.
  default_lang: "pt-BR"
  # Sem proteção contra bots: o único cliente é o backend, na rede interna.
  safe_search: 0
  autocomplete: ""

ui:
  static_use_hash: true

# Os motores abaixo são os que respondem bem a consultas em português e não
# exigem chave. A escolha não é por preferência, é por sobrevivência: o Google
# bloqueia o IP do container (devolve vazio) e o Brave suspende por excesso de
# requisições, então nenhum dos dois segura a busca sozinho. O Bing responde,
# mas puxa plataforma paga (Prime Video, JustWatch, Plex) para o topo. O
# Mojeek e o Startpage entram como reforço. A ideia é cobrir a falha de qualquer
# um com os demais.
#
# A ressalva que o tempo trouxe: a aposta original era o DuckDuckGo, que era
# quem achava os agregadores PT-BR. Hoje ele responde CAPTCHA ao IP do
# container, junto do Google e do Brave — então, na prática, o que sobra é o
# Bing, que devolve só plataforma legal (nada que a lista negra não descarte).
# Enquanto nenhum motor aberto indexar os agregadores, o fallback depende de
# uma busca que raramente entrega a página certa. A busca direta no próprio
# agregador é o caminho que dispensa o motor; ver `docs/integracoes.md`.
#
# A regra do projeto de não depender do DuckDuckGo vale para o **backend**, que
# fala só com o SearXNG. Aqui dentro o DuckDuckGo é um motor entre outros: se
# ele cair, o Bing e o Mojeek continuam respondendo, e o backend nunca sabe de
# onde veio o resultado.
engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: mojeek
    engine: mojeek
    shortcut: mj
    disabled: false

  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: false

  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: true
