memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 300
max_input_time = 300
date.timezone = UTC

; Logs de erro em arquivo gravável pelo usuário do pool (stretor),
; evitando "Permission denied" ao tentar escrever em /proc/self/fd/2.
error_log = /var/log/php-fpm/error.log
log_errors = On

opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
