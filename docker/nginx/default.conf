upstream frontend_vite {
    server frontend:5173;
}

upstream media_service {
    server media-service:3000;
}

server {
    listen 80;
    server_name _;
    root /var/www/backend/public;
    index index.php index.html;

    client_max_body_size 512M;

    # Dependências pré-bundladas do Vite (ex.: /node_modules/.vite/deps/vue.js).
    # Precisa vir ANTES da regra que bloqueia caminhos com "/." — caso contrário
    # o Nginx responde 403 e o app quebra ao carregar vue/pinia.
    location ^~ /node_modules/.vite/ {
        proxy_pass http://frontend_vite;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # Frontend (Vite dev server) na raiz
    location / {
        proxy_pass http://frontend_vite;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # API Laravel
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Media service (proxy para o Node).
    #
    # O Express monta as rotas em `/api/media`, então o prefixo público `/media`
    # é reescrito para `/api/media` antes de chegar ao container. A substituição
    # é feita no próprio `proxy_pass` (com o grupo capturado na location), pois
    # o `rewrite ... break` não altera a URI enviada ao upstream.
    location ~ ^/media/(?<caminho>.*)$ {
        proxy_pass http://media_service/api/media/$caminho$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512M;
        proxy_read_timeout 300;
    }

    # Segmentos HLS do player. O buffering do Nginx precisa ficar desligado:
    # ele acumularia os segmentos antes de repassar, o que atrasa a reprodução
    # e anula o streaming conforme a conversão produz.
    location ~ ^/media/sessao/[^/]+/(playlist\.m3u8|segmento/.+)$ {
        proxy_pass http://media_service/api/media/sessao/$1/$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300;
    }

    # Health check do media service exposto na raiz do prefixo
    location = /media {
        proxy_pass http://media_service/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
