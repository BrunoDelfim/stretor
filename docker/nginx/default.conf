# O DNS embutido do Docker fica em 127.0.0.11. Sem um resolver declarado, o Nginx
# resolve os nomes dos serviços uma única vez, no start, e congela o IP. Quando o
# `docker compose up` recria o backend ou o frontend, eles recebem um IP novo e o
# proxy passa a apontar para um endereço morto — o site cai com 502 até alguém
# reiniciar o Nginx na mão. Declarar o resolver permite a re-resolução em runtime.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /var/www/backend/public;
    index index.php index.html;

    client_max_body_size 512M;

    # Alvos em variáveis: com `proxy_pass`/`fastcgi_pass` recebendo uma variável, o
    # Nginx consulta o resolver a cada requisição em vez de congelar o IP do start.
    # É o que mantém o site de pé depois de recriar os containers.
    set $frontend_vite "http://frontend:5173";
    set $media_service "http://media-service:3000";
    set $backend_upstream "backend:9000";

    # Dependências pré-bundladas do Vite (ex.: /node_modules/.vite/deps/vue.js).
    # Precisa vir ANTES da regra que bloqueia caminhos com "/." — caso contrário
    # o Nginx responde 403 e o app quebra ao carregar vue/pinia.
    location ^~ /node_modules/.vite/ {
        proxy_pass $frontend_vite;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # Frontend (Vite dev server) na raiz
    location / {
        proxy_pass $frontend_vite;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # API Laravel
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Segmentos HLS do player. O buffering do Nginx precisa ficar desligado:
    # ele acumularia os segmentos antes de repassar, o que atrasa a reprodução
    # e anula o streaming conforme a conversão produz.
    #
    # A playlist referencia os segmentos de forma relativa (`segmento-0.ts`), e
    # o player os resolve sobre a URL da playlist. Por isso a rota do Express
    # aceita o nome direto em `/sessao/:id/:arquivo`, e não sob `/segmento/`.
    #
    # Esta location PRECISA vir antes da genérica `/media/(.*)`: em Nginx, as
    # locations por regex são avaliadas na ordem em que aparecem e a primeira
    # que casa vence. Com a genérica na frente, esta nunca era alcançada e o
    # `proxy_buffering off` não tinha efeito — os segmentos eram acumulados.
    location ~ ^/media/sessao/(?<sessao_id>[^/]+)/(?<recurso>playlist\.m3u8|segmento-\d+\.ts)$ {
        proxy_pass $media_service/api/media/sessao/$sessao_id/$recurso$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300;
    }

    # Media service (proxy para o Node).
    #
    # O Express monta as rotas em `/api/media`, então o prefixo público `/media`
    # é reescrito para `/api/media` antes de chegar ao container. A substituição
    # é feita no próprio `proxy_pass` (com o grupo capturado na location), pois
    # o `rewrite ... break` não altera a URI enviada ao upstream.
    location ~ ^/media/(?<caminho>.*)$ {
        proxy_pass $media_service/api/media/$caminho$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512M;
        proxy_read_timeout 300;
    }

    # Health check do media service exposto na raiz do prefixo
    location = /media {
        proxy_pass $media_service/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $backend_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
